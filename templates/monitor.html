{% extends 'appbase.html' %}
{% block content %}<section class="control-panel"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><div><h5 class="mb-1">多路监控实时画面</h5><span class="text-secondary">画面离线时会明确显示状态，不保留旧画面冒充实时监控</span></div>{% if session.role == 'ADMIN' %}<span class="draw-tip">在画面上点击可设置危险区域顶点</span>{% endif %}</div>{% if session.role == 'ADMIN' %}<form id="aiControlForm" class="ai-controls"><label>配置摄像头<select id="controlCamera" class="form-select"></select></label><label class="form-check form-switch"><input class="form-check-input" name="fallEnabled" type="checkbox"><span>摔倒检测</span></label><label class="form-check form-switch"><input class="form-check-input" name="strangerEnabled" type="checkbox"><span>陌生人识别</span></label><label class="form-check form-switch"><input class="form-check-input" name="dangerEnabled" type="checkbox"><span>危险区判定</span></label><label class="form-check form-switch"><input class="form-check-input" name="emotionEnabled" type="checkbox"><span>情感分析</span></label><button class="btn btn-primary" type="submit">保存AI开关</button></form><p id="controlSyncState" class="text-secondary small mt-2 mb-0"></p>{% endif %}</section><div id="cameras" class="camera-container"></div>{% endblock %}
{% block extra_js %}<script src="/static/js/video_render.js"></script>{% endblock %}
