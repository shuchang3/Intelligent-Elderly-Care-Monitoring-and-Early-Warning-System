<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>腰间北斗智能监护系统 - 智慧养老预警系统登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">腰间北斗智能监护系统</h1>
      <p class="login-subtitle">面向养老场景的计算机视觉感知与智能预警系统</p>

      <form id="loginForm" action="/login" method="post">
        <div class="mb-3">
          <label class="form-label">账号</label>
          <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="请输入账号">
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="请输入密码">
        </div>

        <div class="role-radio">
          <label class="form-label">登录身份</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="role" value="admin" id="roleAdmin">
            <label class="form-check-label" for="roleAdmin">系统管理员（机构/项目团队）</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="role" value="family" id="roleFamily">
            <label class="form-check-label" for="roleFamily">老人家属（仅查看告警）</label>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">记住登录状态</label>
        </div>

        <button type="submit" class="login-btn">登录系统</button>
      </form>

      <div class="mt-4 text-center text-secondary" style="font-size:14px;">
        智慧养老视觉监护大创项目
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
