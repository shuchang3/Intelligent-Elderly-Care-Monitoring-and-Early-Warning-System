{% extends "base.html" %}

{% block title %}历史告警检索 - 腰间北斗智能监护系统{% endblock %}
{% block page_name %}历史告警记录查询{% endblock %}

{% block extra_css %}
<style>
    .search-box {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
    }
    table th,table td {
        vertical-align: middle;
    }
    .table-img {
        width: 80px;
        height: 50px;
        object-fit: cover;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5>历史告警记录</h5>
    <a href="/alert/real" class="btn btn-outline-primary">返回实时告警</a>
</div>

<!-- 检索筛选区域 -->
<div class="search-box">
    <div class="row g-3">
        <div class="col-md-3">
            <label>告警类型</label>
            <select class="form-select" id="typeSelect">
                <option value="">全部类型</option>
                <option value="fall">老人摔倒</option>
                <option value="stranger">陌生人闯入</option>
                <option value="danger_zone">危险区闯入</option>
                <option value="emotion">情绪预警</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>监控点位</label>
            <select class="form-select" id="camSelect">
                <option value="">全部摄像头</option>
                <option>cam001</option>
                <option>cam002</option>
                <option>cam003</option>
                <option>cam004</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>起始日期</label>
            <input type="date" class="form-control" id="startDate">
        </div>
        <div class="col-md-3">
            <label>结束日期</label>
            <input type="date" class="form-control" id="endDate">
        </div>
    </div>
    <div class="mt-4 text-center">
        <button class="btn btn-primary" id="searchBtn">查询记录</button>
        <button class="btn btn-outline-secondary ms-3" id="resetBtn">重置筛选</button>
        <button class="btn btn-success ms-3" id="exportBtn">导出Excel</button>
    </div>
</div>

<!-- 告警表格 -->
<div class="card p-3">
    <table class="table table-hover">
        <thead>
            <tr>
                <th>截图</th>
                <th>告警类型</th>
                <th>监控点位</th>
                <th>发生时间</th>
                <th>处理状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="historyTable">
            <tr class="text-center">
                <td colspan="6">请设置筛选条件后点击查询</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block extra_js %}
<script>
const searchBtn = document.getElementById("searchBtn");
const resetBtn = document.getElementById("resetBtn");
const exportBtn = document.getElementById("exportBtn");
const table = document.getElementById("historyTable");

// 查询按钮模拟
searchBtn.onclick = ()=>{
    table.innerHTML = `
        <tr>
            <td><img class="table-img" src=""></td>
            <td>老人摔倒</td>
            <td>cam001</td>
            <td>2026-07-25 09:12:44</td>
            <td><span class="tag-handled">已处理</span></td>
            <td><button class="btn btn-sm btn-primary">回放录像</button></td>
        </tr>
        <tr>
            <td><img class="table-img" src=""></td>
            <td>陌生人闯入</td>
            <td>cam002</td>
            <td>2026-07-25 14:05:10</td>
            <td><span class="tag-unhandle">未处理</span></td>
            <td><button class="btn btn-sm btn-primary">回放录像</button></td>
        </tr>
    `
}
// 重置筛选
resetBtn.onclick = ()=>{
    document.querySelectorAll(".form-select,input[type=date]").forEach(el=>el.value="");
    table.innerHTML = `<tr class="text-center"><td colspan="6">请设置筛选条件后点击查询</td></tr>`;
}
// 导出模拟
exportBtn.onclick = ()=>{
    alert("告警记录Excel文件已开始下载");
}
</script>
{% endblock %}
