{% extends 'appbase.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><h5 class="mb-0">{{ '历史告警记录' if request.path == '/alert/history' else '实时推送告警' }}</h5><a href="{{ '/alert/real' if request.path == '/alert/history' else '/alert/history' }}" class="btn btn-outline-primary">{{ '返回实时告警' if request.path == '/alert/history' else '查看历史告警' }}</a></div>
<section class="search-box {{ 'live-filter' if request.path != '/alert/history' else '' }}"><form id="filters" class="row g-3 align-items-end"><div class="col-sm-6 col-xl-2"><label class="form-label">告警类型</label><select class="form-select" name="eventType"><option value="">全部类型</option><option value="FALL">老人跌倒</option><option value="STRANGER">陌生人</option><option value="DANGER_ZONE">危险区闯入</option><option value="EMOTION_ABNORMAL">情绪异常</option></select></div><div class="col-sm-6 col-xl-2"><label class="form-label">处理状态</label><select class="form-select" name="status"><option value="">全部状态</option><option value="PENDING">待处理</option><option value="PROCESSING">处理中</option><option value="DONE">已完成</option></select></div><div class="col-sm-6 col-xl-2"><label class="form-label">摄像头</label><select id="cameraFilter" class="form-select" name="cameraCode"><option value="">全部摄像头</option></select></div><div class="col-sm-6 col-xl-2"><label class="form-label">人员</label><select id="personFilter" class="form-select" name="personCode"><option value="">全部人员</option></select></div><div class="col-sm-6 col-xl-2"><label class="form-label">起始日期</label><input class="form-control" type="date" name="startDate"></div><div class="col-sm-6 col-xl-2"><label class="form-label">结束日期</label><input class="form-control" type="date" name="endDate"></div><div class="col-12 text-center mt-4"><button class="btn btn-primary" type="submit">查询记录</button><button class="btn btn-outline-secondary ms-3" type="reset">重置筛选</button><button id="export" class="btn btn-success ms-3" type="button">导出当前页</button></div></form></section>
<section class="{{ 'event-card-shell' if request.path != '/alert/history' else 'card border-0 shadow-sm p-3' }}"><div id="eventRows" class="{{ 'alert-card-list' if request.path != '/alert/history' else 'table-responsive' }}"></div><div class="d-flex justify-content-center align-items-center gap-3 mt-3"><button id="previous" class="btn btn-outline-primary btn-sm" type="button">上一页</button><span id="pagination" class="text-secondary"></span><button id="next" class="btn btn-outline-primary btn-sm" type="button">下一页</button><button id="refresh" class="btn btn-outline-secondary btn-sm" type="button">刷新</button></div></section>
{% endblock %}
